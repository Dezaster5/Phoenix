# This nginx usually runs behind another TLS-terminating proxy (avatracker_nginx
# or a host nginx). Preserve the original X-Forwarded-Proto / client IP it sends
# instead of overwriting them with this internal http hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    location /api/ {
        proxy_pass http://phoenix-web:8000/api/;
    }

    location /admin/ {
        proxy_pass http://phoenix-web:8000/admin/;
    }

    location /company-admin/ {
        proxy_pass http://phoenix-web:8000/company-admin/;
    }

    location /static/ {
        proxy_pass http://phoenix-web:8000/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
