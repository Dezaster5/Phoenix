# Vhost for Phoenix Vault (password.avtch.io), served through the existing
# avatracker_nginx container which owns ports 80/443 on the server.
#
# Target location on the server:
#   /home/tamirlan/avatracker-back/nginx/conf.d/password.avtch.io.conf
#
# Prerequisites (see deploy/DEPLOY_PASSWORD_AVTCH_IO.md):
#   1. Phoenix stack is up and attached to the Avatracker network as
#      `phoenix-nginx` (docker-compose.avatracker-net.yml).
#   2. Certificate already issued into the certbot volume:
#      /etc/letsencrypt/live/password.avtch.io/ must exist, otherwise
#      `nginx -t` fails. For the first issuance use the HTTP-only stage
#      from the deploy guide.

server {
    listen 80;
    listen [::]:80;
    server_name password.avtch.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name password.avtch.io;

    ssl_certificate /etc/letsencrypt/live/password.avtch.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/password.avtch.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # Resolve via Docker DNS at request time: this nginx keeps starting and
    # reloading fine even when the phoenix stack is down.
    resolver 127.0.0.11 valid=30s;
    set $phoenix_upstream http://phoenix-nginx:80;

    location / {
        proxy_pass $phoenix_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
